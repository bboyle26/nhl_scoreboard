<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUMBOTRON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070a0f;
    --panel:#0d131c;
    --panel-2:#111a26;
    --line:#1d2a3a;
    --ink:#eef4ff;
    --ink-dim:#9db3d3;
    --dim:#6b7b93;
    --live:#ff2d2d;
    --gold:#d4af37;
    --nhl:#6fb2f0;
    --nfl:#e0b64a;
    /* Solved for at runtime by fitBoard(): --u scales every card metric and
       --cw is a card's natural width at that scale. Both are set on #board. */
    --u:1;
    --cw:430px;
    --gap:20px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Oswald',sans-serif;
    height:100vh;height:100dvh;
    display:flex;flex-direction:column;
    overflow:hidden;
    /* LED dot-grid texture like a real jumbotron screen */
    background-image:
      radial-gradient(circle at center, rgba(40,60,90,.18), transparent 60%),
      radial-gradient(rgba(255,255,255,.035) 1px, transparent 1.4px);
    background-size:100% 100%, 4px 4px;
    background-attachment:fixed;
  }
  /* faint scanlines overlay */
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 2px, transparent 2px 4px);
    mix-blend-mode:multiply;opacity:.4;
  }

  /* ===== Header ===== */
  header{
    display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;
    padding:12px clamp(14px,2.4vw,30px);border-bottom:2px solid var(--line);
    background:linear-gradient(180deg, rgba(13,19,28,.95), rgba(7,10,15,.7));
    flex:none;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:16px;}
  .brand h1{
    font-family:'Anton',sans-serif;font-size:clamp(24px,3.2vw,42px);
    letter-spacing:3px;line-height:.9;
    background:linear-gradient(180deg,#fff,#9fb6d6);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 30px rgba(120,160,220,.25);
  }
  .icons{display:flex;align-items:center;gap:10px;}
  .puck{
    width:clamp(30px,3.4vw,46px);height:clamp(11px,1.4vw,16px);
    background:linear-gradient(180deg,#3a3f48,#0c0e12);
    border-radius:40px;border:1px solid #2a2f38;
    box-shadow:inset 0 2px 4px rgba(255,255,255,.15),0 6px 18px rgba(0,0,0,.6);
  }
  .ball{
    position:relative;width:clamp(26px,3vw,40px);height:clamp(17px,2vw,26px);
    background:linear-gradient(180deg,#9b5324,#4d2409);
    border:1px solid #33180a;border-radius:50% / 42%;
    box-shadow:inset 0 2px 5px rgba(255,255,255,.18),0 6px 18px rgba(0,0,0,.6);
  }
  .ball::before{
    content:"";position:absolute;top:50%;left:26%;right:26%;height:2px;
    background:#efe7d8;transform:translateY(-50%);border-radius:2px;
  }
  .sub{font-size:clamp(11px,1.4vw,15px);color:var(--dim);letter-spacing:4px;text-transform:uppercase;margin-top:4px;font-weight:500;}
  .meta{display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
  .clock-live{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:2px;font-size:clamp(12px,1.5vw,16px);color:var(--ink-dim);text-transform:uppercase;}
  .dot{width:9px;height:9px;border-radius:50%;background:#2f7d3a;box-shadow:0 0 10px #2f7d3a;}
  .updated{color:var(--dim);font-size:13px;letter-spacing:1px;text-transform:uppercase;}
  .controls{display:flex;gap:10px;}
  button.ctrl{
    background:var(--panel-2);color:var(--ink-dim);border:1px solid var(--line);
    padding:9px 14px;border-radius:8px;font-family:'Oswald';font-size:13px;letter-spacing:2px;
    text-transform:uppercase;cursor:pointer;transition:.18s;font-weight:500;
  }
  button.ctrl:hover{background:#16212f;color:#fff;border-color:#2c3e54;}
  button.ctrl.on{background:#1b2a3c;color:#fff;border-color:#3a5170;}

  /* Sweep indicator: shown only while the board is travelling, so a glance says
     both that there is more slate below and how far down the board has got. */
  .sweep{
    display:none;align-items:center;gap:9px;
    font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);
  }
  .sweep.on{display:flex;}
  .sweep i{
    position:relative;width:74px;height:4px;border-radius:2px;
    background:#22304a;font-style:normal;overflow:hidden;
  }
  .sweep i b{
    position:absolute;top:0;bottom:0;left:0;width:30%;border-radius:2px;
    background:var(--gold);box-shadow:0 0 8px var(--gold);
  }

  /* league filter */
  .leagues{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel-2);}
  button.lg{
    background:transparent;color:var(--dim);border:0;border-right:1px solid var(--line);
    padding:9px 15px;font-family:'Anton';font-size:14px;letter-spacing:2px;cursor:pointer;transition:.18s;
  }
  button.lg:last-child{border-right:0;}
  button.lg:hover{color:#fff;background:#16212f;}
  button.lg.on{background:#16212f;color:#fff;box-shadow:inset 0 -3px 0 var(--gold);}
  button.lg.on[data-league="nhl"]{box-shadow:inset 0 -3px 0 var(--nhl);}
  button.lg.on[data-league="nfl"]{box-shadow:inset 0 -3px 0 var(--nfl);}

  /* ===== Layout =====
     `main` is a fixed viewport pane and every metric inside a card is expressed
     against --u, the one scale the fit engine solves for at runtime (see
     fitBoard). --cw is a card's natural width at that scale, and --dc is how
     many columns a given day lays its games out in.

     Days stack: one day, then the next, each a centred grid of its own games.
     Tiles hold a size worth reading rather than shrinking to fit the screen -
     when the slate is longer than the pane the board sweeps through it on its
     own instead (see the auto-sweep section in the script). */
  main{
    flex:1;min-height:0;display:flex;flex-direction:column;
    padding:clamp(8px,1.4vh,18px) clamp(10px,2vw,28px);
    overflow:hidden;
  }
  #board.board{
    flex:none;                     /* never let the flex box squash it - we measure it */
    margin:auto 0;                 /* centres a short slate... */
    width:100%;
    will-change:transform;
  }
  #board.board.sweeping{margin:0;}  /* ...but a sweeping one starts at the top */
  .grid{
    display:grid;
    grid-template-columns:repeat(var(--dc),minmax(0,1fr));
    gap:calc(var(--gap) * var(--u));
  }

  /* ===== Day section ===== */
  .day{
    /* --dc is a day's own column count, never more than it has games, so a
       one-game Thursday is a properly sized card in the middle of the board
       rather than one squeezed into a quarter of the row. --cardmax is how far
       that lone card may stretch before it stops looking like the others. */
    --dc:1;
    --cardmax:calc(var(--cw) * 1.6);
    max-width:calc(var(--dc) * var(--cardmax) + (var(--dc) - 1) * var(--gap) * var(--u));
    margin-inline:auto;
  }
  .day + .day{margin-top:calc(26px * var(--u));}
  .day-head{
    display:flex;align-items:center;gap:calc(14px * var(--u));
    margin:0 0 calc(12px * var(--u));overflow:hidden;
  }
  .day-rel{font-family:'Anton';font-size:calc(26px * var(--u));letter-spacing:.08em;color:#e7eefc;white-space:nowrap;}
  .day.today .day-rel{color:var(--gold);text-shadow:0 0 22px rgba(212,175,55,.3);}
  .day-rule{flex:1 1 calc(10px * var(--u));height:1px;background:linear-gradient(90deg,var(--line),transparent);}
  /* The date and count give way before the day name does, so a one-column
     block clips them instead of overflowing its line. */
  .day-full,.day-count{
    flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:clip;
  }
  .day-full{font-size:calc(13px * var(--u));letter-spacing:.2em;text-transform:uppercase;color:var(--dim);}
  .day-count{font-size:calc(12px * var(--u));letter-spacing:.15em;text-transform:uppercase;color:#566273;}

  /* ===== Game card ===== */
  .card{
    background:linear-gradient(160deg,var(--panel),var(--bg));
    border:1px solid var(--line);border-radius:calc(16px * var(--u));overflow:hidden;
    box-shadow:0 18px 50px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.04);
    position:relative;
    display:flex;flex-direction:column;
    animation:rise .5s ease both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
  .card.live{border-color:rgba(255,45,45,.45);box-shadow:0 0 0 1px rgba(255,45,45,.25),0 18px 50px rgba(0,0,0,.55);}

  .status-bar{
    display:flex;align-items:center;justify-content:space-between;gap:calc(10px * var(--u));
    padding:calc(9px * var(--u)) calc(16px * var(--u));
    font-size:calc(13px * var(--u));letter-spacing:.15em;text-transform:uppercase;font-weight:500;
    border-bottom:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--dim);
  }
  .sb-left{display:flex;align-items:center;gap:calc(8px * var(--u));min-width:0;}
  .chip{
    font-family:'Anton';font-size:calc(12px * var(--u));letter-spacing:.15em;
    padding:calc(2px * var(--u)) calc(7px * var(--u));border-radius:calc(5px * var(--u));flex-shrink:0;
  }
  .chip.nhl{background:rgba(111,178,240,.14);color:var(--nhl);border:1px solid rgba(111,178,240,.35);}
  .chip.nfl{background:rgba(224,182,74,.13);color:var(--nfl);border:1px solid rgba(224,182,74,.32);}
  .series{color:var(--gold);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .state{display:flex;align-items:center;gap:calc(8px * var(--u));font-weight:600;color:var(--ink-dim);white-space:nowrap;}
  .state.live{color:var(--live);}
  .state .dot{width:calc(9px * var(--u));height:calc(9px * var(--u));}
  .state.live .dot{background:var(--live);box-shadow:0 0 12px var(--live);animation:pulse 1.1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(.8);}}
  .state.final{color:#cdd8ea;}
  .state.off{color:#ff9f6b;}
  .state.today{color:var(--gold);}

  .teams{padding:calc(6px * var(--u)) 0;flex:1;display:flex;flex-direction:column;justify-content:center;}
  .team{
    display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;
    gap:calc(10px * var(--u));
    padding:calc(15px * var(--u)) calc(20px * var(--u));position:relative;
  }
  .team + .team{border-top:1px solid var(--line);}
  .team .accent{
    position:absolute;left:0;top:0;bottom:0;width:calc(5px * var(--u));
    background:var(--tc,#444);box-shadow:0 0 22px -2px var(--tc,#444);
  }
  .tinfo{display:flex;align-items:center;gap:calc(15px * var(--u));min-width:0;}
  .logo{
    width:calc(68px * var(--u));height:calc(68px * var(--u));object-fit:contain;flex-shrink:0;
    filter:drop-shadow(0 4px 12px rgba(0,0,0,.6));
  }
  .names{min-width:0;}
  .nameline{display:flex;align-items:center;gap:calc(9px * var(--u));}
  .abbrev{
    font-family:'Anton';font-size:calc(46px * var(--u));line-height:.92;letter-spacing:.02em;
    color:#fff;white-space:nowrap;
  }
  .poss{
    width:calc(15px * var(--u));height:calc(10px * var(--u));flex-shrink:0;
    background:linear-gradient(180deg,#9b5324,#4d2409);border:1px solid #33180a;border-radius:50% / 42%;
    box-shadow:0 0 14px rgba(255,170,90,.55);
  }
  .fullname{
    font-size:calc(14px * var(--u));color:var(--dim);letter-spacing:.14em;text-transform:uppercase;
    font-weight:400;margin-top:calc(2px * var(--u));
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .detail{
    font-size:calc(11px * var(--u));color:#5a6a82;letter-spacing:.12em;text-transform:uppercase;
    margin-top:calc(4px * var(--u));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .score{
    font-family:'Anton';font-size:calc(78px * var(--u));line-height:.85;
    color:#fff;text-shadow:0 0 30px var(--tc-glow,rgba(255,255,255,.2));
    min-width:1.4ch;text-align:right;font-variant-numeric:tabular-nums;
  }
  .team.winner .score{color:#fff;}
  .team.loser .abbrev,.team.loser .score{opacity:.55;}

  /* scheduled / hero start time */
  .vs-time{
    text-align:center;padding:calc(10px * var(--u));
    font-family:'Anton';font-size:calc(26px * var(--u));
    color:var(--ink);letter-spacing:.08em;
  }
  .vs-sub{
    font-family:'Oswald';font-size:calc(12px * var(--u));color:var(--dim);
    letter-spacing:.15em;text-transform:uppercase;margin-top:calc(3px * var(--u));
  }
  .vs-sub.today{color:var(--gold);}

  .footer-bar{
    display:flex;align-items:center;justify-content:space-between;gap:calc(10px * var(--u));
    padding:calc(7px * var(--u)) calc(16px * var(--u));
    font-size:calc(11px * var(--u));letter-spacing:.12em;text-transform:uppercase;
    color:#566273;border-top:1px solid var(--line);background:rgba(0,0,0,.2);
  }
  .footer-bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .footer-bar .mid{color:#7f8ea6;text-align:center;}

  /* ===== Feed warning strip ===== */
  .warn{
    display:flex;align-items:center;gap:10px;margin:0 0 calc(14px * var(--u));
    padding:calc(8px * var(--u)) calc(14px * var(--u));
    border:1px solid rgba(255,107,107,.35);background:rgba(255,107,107,.07);border-radius:10px;
    color:#ff9b9b;font-size:calc(13px * var(--u));letter-spacing:.12em;text-transform:uppercase;
  }

  /* ===== Idle / error states ===== */
  .center-state{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:18px;color:var(--dim);overflow:hidden;
  }
  .center-state h2{font-family:'Anton';font-size:clamp(34px,6vw,72px);color:#cdd8ea;letter-spacing:2px;}
  .center-state p{font-size:clamp(14px,2vw,19px);letter-spacing:2px;text-transform:uppercase;max-width:640px;line-height:1.6;}
  .center-state .next{color:var(--gold);font-weight:600;}
  .spinner{width:54px;height:54px;border:5px solid var(--line);border-top-color:#4a86c5;border-radius:50%;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .err{color:#ff6b6b;}
  .hint{font-size:12px;color:#4a5568;max-width:560px;line-height:1.7;text-transform:none;letter-spacing:.5px;}

  @media (max-width:560px){
    header{gap:10px;padding:10px 14px;}
    .meta{gap:10px;}
    .day-full{display:none;}
  }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="icons">
        <span class="puck" id="iconPuck"></span>
        <span class="ball" id="iconBall"></span>
      </div>
      <div>
        <h1>JUMBOTRON</h1>
        <div class="sub" id="dateLabel">Loading&hellip;</div>
      </div>
    </div>
    <div class="meta">
      <div class="leagues" id="leagueFilter">
        <button class="lg" data-league="all">ALL</button>
        <button class="lg" data-league="nhl">NHL</button>
        <button class="lg" data-league="nfl">NFL</button>
      </div>
      <div class="clock-live"><span class="dot" id="liveDot"></span><span id="liveCount">&mdash;</span></div>
      <div class="sweep" id="sweep"><span>Auto</span><i><b></b></i></div>
      <div class="updated" id="updated">&mdash;</div>
      <div class="controls">
        <button class="ctrl" id="refreshBtn">&#8635; Refresh</button>
        <button class="ctrl" id="fsBtn">&#9974; Fullscreen</button>
      </div>
    </div>
  </header>

  <main>
    <div id="board" class="center-state">
      <div class="spinner"></div>
      <p>Connecting to the leagues&hellip;</p>
    </div>
  </main>

<script>
// Calls our own proxy (server.js / server.py / the Firebase function), NOT the
// league APIs directly - that avoids the CORS block since these are same-origin.
const SOURCES = {
  nhl: { name:"NHL", endpoint:"/api/nhl" },
  nfl: { name:"NFL", endpoint:"/api/nfl" }
};

// NHL primary team colors keyed by abbreviation. The NFL feed ships each team's
// own colors, so only hockey needs a hard-coded map.
const NHL_COLORS = {
  ANA:"#F47A38", BOS:"#FFB81C", BUF:"#0038A8", CGY:"#C8102E", CAR:"#CC0000",
  CHI:"#CF0A2C", COL:"#6F263D", CBJ:"#002654", DAL:"#00A14B", DET:"#CE1126",
  EDM:"#FF4C00", FLA:"#C8102E", LAK:"#A2AAAD", MIN:"#154734", MTL:"#AF1E2D",
  NSH:"#FFB81C", NJD:"#CE1126", NYI:"#00539B", NYR:"#0038A8", OTT:"#C52032",
  PHI:"#F74902", PIT:"#FCB514", SJS:"#006D75", SEA:"#99D9D9", STL:"#003087",
  TBL:"#00BFFF", TOR:"#00205B", UTA:"#71AFE5", VAN:"#00843D", VGK:"#D4AF37",
  WSH:"#C8102E", WPG:"#55ACEE", ARI:"#8C2633"
};

const STORE_KEY = "jumbotron.league";
let filter = "all";
try{ filter = localStorage.getItem(STORE_KEY) || "all"; }catch(e){}
if(!["all","nhl","nfl"].includes(filter)) filter = "all";

let timer = null;

/* ===================== colors ===================== */

function hexToRgb(h){
  h = String(h || "").replace("#","").trim();
  if(h.length === 3) h = h.split("").map(c => c + c).join("");
  if(!/^[0-9a-fA-F]{6}$/.test(h)) return null;
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
const luminance = rgb => (0.2126*rgb[0] + 0.7152*rgb[1] + 0.0722*rgb[2]) / 255;
const toHex = rgb => "#" + rgb.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2,"0")).join("");
const towardWhite = (rgb, t) => rgb.map(v => v + (255 - v) * t);

// Near-black team colors (Raiders, Steelers, Texans navy) disappear against the
// board, so fall back to the alternate color, then to a lightened primary.
function accentColor(primary, alternate){
  const p = hexToRgb(primary), a = hexToRgb(alternate);
  if(p && luminance(p) >= 0.14) return toHex(p);
  if(a && luminance(a) >= 0.14 && luminance(a) <= 0.92) return toHex(a);
  if(p) return toHex(towardWhite(p, 0.45));
  return "#5a6a82";
}

/* ===================== dates ===================== */
// Everything here works off the viewer's local day, never the feed's idea of
// "today": the NHL feed rolls forward to the next day that has games, and the
// NFL feed returns a whole week at a time.

const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const dayKey = d => startOfDay(d).getTime();

const daysFromToday = d => Math.round((dayKey(d) - dayKey(new Date())) / 86400000);

// Short form for a card's status bar, which has no room for a second line.
function dayPhrase(d){
  const n = daysFromToday(d);
  if(n === 0) return "TODAY";
  if(n === 1) return "TOMORROW";
  if(n === -1) return "YESTERDAY";
  return d.toLocaleDateString([], {weekday:"short", month:"short", day:"numeric"}).toUpperCase();
}

// Big line of a day heading; the date itself goes on the small line beside it.
function dayHeadline(d){
  const n = daysFromToday(d);
  if(n === 0) return "TODAY";
  if(n === 1) return "TOMORROW";
  if(n === -1) return "YESTERDAY";
  return d.toLocaleDateString([], {weekday:"long"}).toUpperCase();
}

function monthDay(d){
  const opts = {month:"long", day:"numeric"};
  if(d.getFullYear() !== new Date().getFullYear()) opts.year = "numeric";
  return d.toLocaleDateString([], opts);
}

const fullDay = d => d.toLocaleDateString([], {weekday:"long", month:"long", day:"numeric"});

function startTimeLocal(date){
  if(!date || isNaN(date)) return "TBD";
  return date.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
}

const ordinal = n => n === 1 ? "1ST" : n === 2 ? "2ND" : n === 3 ? "3RD" : n + "TH";

/* ===================== NHL ===================== */

function nhlPeriodLabel(g){
  const pd = g.periodDescriptor || {};
  const n = pd.number || g.period || 1;
  const maxReg = pd.maxRegulationPeriods || 3;
  const t = pd.periodType;
  if(t === "SO") return "SO";
  if(t === "OT"){ const ot = n - maxReg; return ot <= 1 ? "OT" : ot + "OT"; }
  return ordinal(n);
}

// returns {kind:'live'|'final'|'pre'|'sched'|'off', label, clock}
function nhlStatus(g, start){
  const s = g.gameState;
  if(g.gameScheduleState === "PPD") return {kind:"off", label:"POSTPONED", clock:""};
  if(g.gameScheduleState === "CNCL") return {kind:"off", label:"CANCELED", clock:""};
  if(s === "LIVE" || s === "CRIT"){
    const c = g.clock || {};
    if(c.inIntermission) return {kind:"live", label:"INT", clock:c.timeRemaining || ""};
    return {kind:"live", label:nhlPeriodLabel(g), clock:c.timeRemaining || ""};
  }
  if(s === "OFF" || s === "FINAL"){
    const last = (g.gameOutcome && g.gameOutcome.lastPeriodType) || "REG";
    const suffix = last === "OT" ? "/OT" : last === "SO" ? "/SO" : "";
    return {kind:"final", label:"FINAL" + suffix, clock:""};
  }
  if(s === "PRE") return {kind:"pre", label:"PRE-GAME", clock:""};
  return {kind:"sched", label:startTimeLocal(start), clock:""};
}

function nhlSeriesText(g){
  const ss = g.seriesStatus;
  if(!ss) return "";
  const t = ss.seriesTitle || (ss.seriesAbbrev || "");
  let standings = "";
  if(ss.topSeedTeamAbbrev){
    if(ss.topSeedWins === ss.bottomSeedWins){
      standings = "SERIES TIED " + ss.topSeedWins + "-" + ss.bottomSeedWins;
    }else{
      const lead = ss.topSeedWins > ss.bottomSeedWins ? ss.topSeedTeamAbbrev : ss.bottomSeedTeamAbbrev;
      const hi = Math.max(ss.topSeedWins, ss.bottomSeedWins);
      const lo = Math.min(ss.topSeedWins, ss.bottomSeedWins);
      standings = hi === (ss.neededToWin || 4) ? lead + " WINS " + hi + "-" + lo : lead + " LEADS " + hi + "-" + lo;
    }
  }
  const gnum = ss.gameNumberOfSeries ? "GAME " + ss.gameNumberOfSeries : "";
  return [t, gnum, standings].filter(Boolean).join("  •  ");
}

function nhlTeam(t, st){
  const scored = st.kind === "live" || st.kind === "final";
  let detail = "";
  if(scored && t.sog != null) detail = t.sog + " SOG";
  else if(t.record) detail = t.record;
  return {
    abbrev: t.abbrev || "",
    name: (t.name && t.name.default) || "",
    logo: t.logo || "",
    score: typeof t.score === "number" ? t.score : null,
    color: NHL_COLORS[t.abbrev] || "#5a6a82",
    detail: detail,
    possession: false
  };
}

function normalizeNHL(data){
  return ((data && data.games) || []).map(g => {
    const start = new Date(g.startTimeUTC);
    const st = nhlStatus(g, start);
    const season = g.gameType === 1 ? "PRESEASON" : g.gameType === 3 ? "STANLEY CUP PLAYOFFS" : "REGULAR SEASON";
    const tv = (g.tvBroadcasts || []).map(b => b.network).filter(Boolean);
    return {
      id: "nhl-" + g.id,
      league: "nhl",
      start: start,
      state: st.kind, label: st.label, clock: st.clock,
      away: nhlTeam(g.awayTeam || {}, st),
      home: nhlTeam(g.homeTeam || {}, st),
      venue: (g.venue && g.venue.default) || "",
      note: nhlSeriesText(g) || (g.gameType === 3 ? "PLAYOFFS" : ""),
      mid: [...new Set(tv)].slice(0,3).join(" / "),
      meta: season
    };
  });
}

/* ===================== NFL ===================== */

function nflStatus(status, start){
  const t = (status && status.type) || {};
  const name = t.name || "";
  const period = (status && status.period) || 0;
  const clock = (status && status.displayClock) || "";
  if(/POSTPONED|CANCEL|SUSPENDED|FORFEIT/.test(name))
    return {kind:"off", label:String(t.shortDetail || t.description || "POSTPONED").toUpperCase(), clock:""};
  if(t.state === "in"){
    if(/HALFTIME/.test(name)) return {kind:"live", label:"HALFTIME", clock:""};
    if(/END_PERIOD|END_OF_PERIOD/.test(name)) return {kind:"live", label:"END " + (period > 4 ? "OT" : ordinal(period)), clock:""};
    if(/DELAY/.test(name)) return {kind:"live", label:"DELAYED", clock:""};
    const per = period > 4 ? (period > 5 ? (period - 4) + "OT" : "OT") : ordinal(period || 1);
    return {kind:"live", label:per, clock:clock};
  }
  if(t.state === "post") return {kind:"final", label: period > 4 ? "FINAL/OT" : "FINAL", clock:""};
  return {kind:"sched", label:startTimeLocal(start), clock:""};
}

function nflTeam(c, possId){
  const t = (c && c.team) || {};
  const records = (c && c.records) || [];
  const rec = records.find(r => r.type === "total") || records[0];
  const raw = c && c.score;
  const score = raw === undefined || raw === null || raw === "" ? NaN : Number(raw);
  return {
    abbrev: t.abbreviation || "",
    name: t.shortDisplayName || t.name || "",
    logo: t.logo || "",
    score: isNaN(score) ? null : score,
    color: accentColor(t.color, t.alternateColor),
    detail: (rec && rec.summary) || "",
    possession: !!(possId && c && String(c.id) === String(possId))
  };
}

function normalizeNFL(data){
  return ((data && data.events) || []).map(ev => {
    const comp = (ev.competitions && ev.competitions[0]) || {};
    const start = new Date(comp.date || ev.date);
    const st = nflStatus(ev.status || comp.status, start);
    const cs = comp.competitors || [];
    const home = cs.find(c => c.homeAway === "home") || cs[0] || {};
    const away = cs.find(c => c.homeAway === "away") || cs[1] || {};
    const sit = comp.situation || {};
    const possId = st.kind === "live" ? sit.possession : null;

    const type = (ev.season && ev.season.type) || 2;
    const season = type === 1 ? "PRESEASON" : type === 3 ? "POSTSEASON" : "REGULAR SEASON";
    const week = ev.week && ev.week.number ? "WEEK " + ev.week.number : "";
    const headline = (comp.notes || []).map(n => n.headline).filter(Boolean)[0] || "";
    const tv = comp.broadcast || (comp.broadcasts || []).map(b => (b.names || []).join("/")).filter(Boolean).join(" / ");

    return {
      id: "nfl-" + ev.id,
      league: "nfl",
      start: start,
      state: st.kind, label: st.label, clock: st.clock,
      away: nflTeam(away, possId),
      home: nflTeam(home, possId),
      venue: (comp.venue && comp.venue.fullName) || "",
      note: headline || week,
      mid: (st.kind === "live" && sit.downDistanceText) ? sit.downDistanceText : tv,
      meta: [season, headline ? week : ""].filter(Boolean).join("  •  ")
    };
  });
}

/* ===================== rendering ===================== */

const esc = s => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

function teamRow(team, opp, game){
  const st = game.state;
  const decided = st === "live" || st === "final";
  let cls = "team";
  if(decided && typeof team.score === "number" && typeof opp.score === "number"){
    if(team.score > opp.score) cls += " winner";
    else if(team.score < opp.score && st === "final") cls += " loser";
  }
  const detail = team.detail ? '<div class="detail">' + esc(team.detail) + "</div>" : "";
  const poss = team.possession ? '<span class="poss" title="Possession"></span>' : "";
  return '' +
    '<div class="' + cls + '" style="--tc:' + esc(team.color) + ';--tc-glow:' + esc(team.color) + '66;">' +
      '<span class="accent"></span>' +
      '<div class="tinfo">' +
        '<img class="logo" src="' + esc(team.logo) + '" alt="' + esc(team.abbrev) + '" onerror="this.style.display=\'none\'">' +
        '<div class="names">' +
          '<div class="nameline"><span class="abbrev">' + esc(team.abbrev) + "</span>" + poss + "</div>" +
          '<div class="fullname">' + esc(team.name) + "</div>" +
          detail +
        "</div>" +
      "</div>" +
      '<div class="score">' + (decided ? (team.score == null ? 0 : team.score) : "") + "</div>" +
    "</div>";
}

function gameCard(g){
  const liveCls = g.state === "live" ? " live" : "";
  const stateCls = g.state === "live" ? "state live"
    : g.state === "final" ? "state final"
    : g.state === "off" ? "state off" : "state";
  const league = SOURCES[g.league] ? SOURCES[g.league].name : String(g.league).toUpperCase();
  const today = daysFromToday(g.start) === 0;

  // A game that hasn't started carries its day where the clock would go, so the
  // date is never left to be assumed — these are routinely NOT today. (The NHL
  // feed rolls on to the next day that has games; the NFL feed returns a week.)
  const stateInner = g.state === "live"
    ? '<span class="dot"></span>' + esc(g.label) + " " + esc(g.clock)
    : g.state === "sched" || g.state === "off" ? esc(dayPhrase(g.start))
    : esc(g.label);
  const stateExtra = (g.state === "sched" || g.state === "off") && today ? " today" : "";

  let body;
  if(g.state === "sched" || g.state === "pre" || g.state === "off"){
    const drop = g.league === "nfl" ? "KICKOFF" : "PUCK DROP";
    const headline = g.state === "pre" ? "PRE-GAME" : g.state === "off" ? g.label : "@ " + g.label;
    const sub = g.state === "sched" ? drop
      : g.state === "pre" ? drop + " " + startTimeLocal(g.start)
      : dayPhrase(g.start) + " • " + startTimeLocal(g.start);
    body = teamRow(g.away, g.home, g) +
      '<div class="vs-time">' + esc(headline) +
        '<div class="vs-sub">' + esc(sub) + "</div>" +
      "</div>" +
      teamRow(g.home, g.away, g);
  }else{
    body = teamRow(g.away, g.home, g) + teamRow(g.home, g.away, g);
  }

  return '' +
    '<div class="card' + liveCls + '">' +
      '<div class="status-bar">' +
        '<span class="sb-left">' +
          '<span class="chip ' + esc(g.league) + '">' + esc(league) + "</span>" +
          '<span class="series">' + esc(g.note) + "</span>" +
        "</span>" +
        '<span class="' + stateCls + stateExtra + '">' + stateInner + "</span>" +
      "</div>" +
      '<div class="teams">' + body + "</div>" +
      '<div class="footer-bar">' +
        "<span>" + esc(g.venue) + "</span>" +
        '<span class="mid">' + esc(g.mid) + "</span>" +
        "<span>" + esc(g.meta) + "</span>" +
      "</div>" +
    "</div>";
}

// Within a day: live first, then what's about to start, then finals.
const STATE_RANK = {live:0, pre:1, sched:2, final:3, off:4};
const stateRank = g => STATE_RANK[g.state] == null ? 5 : STATE_RANK[g.state];

function daySection(key, games){
  const date = new Date(Number(key));
  const offset = daysFromToday(date);
  games.sort((a, b) => stateRank(a) - stateRank(b) || a.start - b.start);
  const liveHere = games.filter(g => g.state === "live").length;
  const plural = games.length === 1 ? "" : "S";
  const count = (liveHere ? liveHere + " LIVE · " : "") + games.length + " GAME" + plural;
  return '' +
    '<section class="day' + (offset === 0 ? " today" : "") + '" data-n="' + games.length + '">' +
      '<div class="day-head">' +
        '<span class="day-rel">' + esc(dayHeadline(date)) + "</span>" +
        '<span class="day-full">' + esc(monthDay(date)) + "</span>" +
        '<span class="day-rule"></span>' +
        '<span class="day-count">' + esc(count) + "</span>" +
      "</div>" +
      '<div class="grid">' + games.map(gameCard).join("") + "</div>" +
    "</section>";
}

function warnStrip(errors){
  if(!errors.length) return "";
  const txt = errors.map(e => SOURCES[e.league].name + " feed unavailable (" + e.msg + ")").join(" · ");
  return '<div class="warn">⚠ ' + esc(txt) + "</div>";
}

function render(games, errors){
  const board = document.getElementById("board");

  document.getElementById("dateLabel").textContent = fullDay(new Date());

  const live = games.filter(g => g.state === "live");
  const liveDot = document.getElementById("liveDot");
  const liveCount = document.getElementById("liveCount");
  if(live.length){
    liveDot.style.background = "var(--live)";
    liveDot.style.boxShadow = "0 0 12px var(--live)";
    liveCount.textContent = live.length + " LIVE";
  }else{
    liveDot.style.background = "#2f7d3a";
    liveDot.style.boxShadow = "0 0 10px #2f7d3a";
    liveCount.textContent = games.length ? games.length + " GAMES" : "NO GAMES";
  }

  if(!games.length){
    resetFit();
    board.className = "center-state";
    board.innerHTML =
      '<div class="icons" style="transform:scale(2);margin-bottom:16px;">' +
        (filter !== "nfl" ? '<span class="puck"></span>' : "") +
        (filter !== "nhl" ? '<span class="ball"></span>' : "") +
      "</div>" +
      "<h2>NO GAMES SCHEDULED</h2>" +
      "<p>Nothing on the board right now. Check back on game day.</p>" +
      warnStrip(errors);
    return;
  }

  // Group into the viewer's local days: today first, then upcoming in order,
  // then the recent past most-recent-first.
  const byDay = new Map();
  games.forEach(g => {
    const k = dayKey(g.start);
    if(!byDay.has(k)) byDay.set(k, []);
    byDay.get(k).push(g);
  });
  const days = [...byDay.entries()].sort((a, b) => {
    const da = daysFromToday(new Date(a[0])), db = daysFromToday(new Date(b[0]));
    if(da >= 0 && db < 0) return -1;
    if(db >= 0 && da < 0) return 1;
    return da >= 0 ? da - db : db - da;
  });

  board.className = "board";
  board.innerHTML = warnStrip(errors) + days.map(d => daySection(d[0], d[1])).join("");
  fitBoard();

  document.getElementById("updated").textContent =
    "Updated " + new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit", second:"2-digit"});
}

function showError(errors){
  const board = document.getElementById("board");
  const names = errors.map(e => SOURCES[e.league].name).join(" &amp; ");
  resetFit();
  board.className = "center-state";
  board.innerHTML =
    '<h2 class="err">CONNECTION LOST</h2>' +
    '<p class="err">' + names + ": " + esc(errors.map(e => e.msg).join(" · ")) + "</p>" +
    '<p class="hint">The page couldn\'t reach its <code>/api/nhl</code> / <code>/api/nfl</code> proxy. Make sure the page is ' +
    "being served by your proxy - either the local server (<code>node server.js</code> or <code>python3 server.py</code>) " +
    "or the deployed Firebase function - and not opened directly as a <code>file://</code> URL. The board will keep retrying.</p>";
}

/* ===================== loading ===================== */

const activeLeagues = () => filter === "all" ? ["nhl", "nfl"] : [filter];

async function fetchLeague(key){
  const res = await fetch(SOURCES[key].endpoint, {cache:"no-store"});
  if(!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  return key === "nhl" ? normalizeNHL(data) : normalizeNFL(data);
}

async function load(){
  const keys = activeLeagues();
  const settled = await Promise.allSettled(keys.map(fetchLeague));
  const games = [], errors = [];
  settled.forEach((r, i) => {
    if(r.status === "fulfilled") games.push.apply(games, r.value);
    else errors.push({league:keys[i], msg:(r.reason && r.reason.message) || "unavailable"});
  });

  // One league going down shouldn't blank the board - only bail if all did.
  if(errors.length === keys.length){
    showError(errors);
    clearTimeout(timer);
    timer = setTimeout(load, 20000); // keep retrying
    return;
  }
  render(games, errors);
  scheduleNext(games);
}

function scheduleNext(games){
  clearTimeout(timer);
  const hasLive = games.some(g => g.state === "live");
  // refresh faster when games are live
  timer = setTimeout(load, hasLive ? 10000 : 30000);
}

/* ===================== fit engine =====================
   This is a display, not a page, so there is no scrollbar and nothing to reach
   for. Every card metric is a multiple of --u, and after each render we solve
   for the largest --u where the whole slate still fits the viewport pane.

   What it will not do is shrink past the point of being worth looking at. A
   tile has a floor - sized so a screenful shows about TILES_DEEP rows of them,
   which means it grows with the screen rather than with the slate. A quiet
   night still blows up to fill the board; a full Sunday holds that floor and
   the board sweeps down through it instead (see auto-sweep below).

   Board height is monotone in --u, so each column count is solved by a
   bracketed Newton search: height is near-linear in u, so it settles in a
   handful of reflows. */

const MAX_U      = 1.5;   // above this a two-game night looks like a billboard typo
const MIN_U      = 0.55;  // hard floor, whatever the screen: below this a tile stops being one
const TILES_DEEP = 2.6;   // rows of tiles a screenful should show - the size knob
const GAP_BASE   = 20;    // --gap at u=1
const CARD_W     = 430;   // a card's natural width at u=1
const MAX_COLS   = 10;

let lastFit = null;   // {sig, cols, u} - see layoutSignature

const boardEl = () => document.getElementById("board");
const clamp = (lo, v, hi) => Math.max(lo, Math.min(hi, v));

/* Columns for one day inside a board-wide budget of `cap`. Spreading the games
   evenly over the rows they need is what keeps the last row from trailing off -
   nine games in a seven-column budget is 5+4, not 7+2. */
function dayCols(n, cap){
  const c = Math.max(1, Math.min(n, cap));
  return Math.ceil(n / Math.ceil(n / c));
}

const dayEls = board => [...board.querySelectorAll(".day")];
const dayShape = (board, cap) => dayEls(board).map(d => dayCols(+d.dataset.n || 1, cap)).join(",");

function measure(board, cap, u){
  dayEls(board).forEach(d => d.style.setProperty("--dc", dayCols(+d.dataset.n || 1, cap)));
  board.style.setProperty("--u", u);
  board.style.setProperty("--cw", (CARD_W * u) + "px");
  return board.scrollHeight;          // integer, and rounded *up*
}

/* The widest day still has to fit the pane on one line, which caps u. */
function widthCap(board, cap, availW){
  let wide = 1;
  dayEls(board).forEach(d => { wide = Math.max(wide, dayCols(+d.dataset.n || 1, cap)); });
  return Math.min(MAX_U, availW / (CARD_W * wide + GAP_BASE * (wide - 1)));
}

/* How small a tile is allowed to get before the board stops trying to fit the
   slate and starts sweeping it. Taken off a real card at unit scale rather than
   assumed, because a scheduled card is taller than a final one and it is the
   tall one that sets the row. */
function tileFloor(board, availH){
  measure(board, 1, 1);
  let row = 0;
  board.querySelectorAll(".card").forEach(c => { row = Math.max(row, c.offsetHeight); });
  if(!row) return MIN_U;
  return clamp(MIN_U, availH / (TILES_DEEP * (row + GAP_BASE)), MAX_U);
}

/* Columns that fill the pane at a given scale, for when the slate is going to
   sweep and the only thing left to decide is how wide to run it. */
const colsForWidth = (availW, u) => clamp(
  1, Math.floor((availW + GAP_BASE * u) / ((CARD_W + GAP_BASE) * u)), MAX_COLS);

/* Largest u at this column budget whose board still clears `target`, or null.
   Newton converges fast, but it approaches the limit from above and integer
   scrollHeight would let it stall one pixel over forever - so every step is
   kept inside a bisection bracket. */
function solveScale(board, cap, uWidth, seed, target, floor){
  let lo = floor, hi = uWidth, u = seed, fit = null;
  for(let pass = 0; pass < 8; pass++){
    u = Math.min(hi, Math.max(floor, u));
    const h = measure(board, cap, u);
    if(h <= target){
      if(fit == null || u > fit) fit = u;
      if(u >= hi - 0.002) break;      // already at the width ceiling
      lo = u;
    }else{
      hi = u;
    }
    if(hi - lo <= 0.003) break;       // 0.3% of scale - past noticing
    const next = u * (target / h);
    u = (next > lo && next < hi) ? next : (lo + hi) / 2;
  }
  return fit;
}

/* Largest scale at which the whole slate fits, or null if none reaches the
   floor. Column budgets that produce the same day shapes are the same layout,
   so each distinct one is tried once. */
function searchFit(board, availW, target, floor){
  const maxDay = Math.max(1, ...dayEls(board).map(d => +d.dataset.n || 1));
  const seen = new Set();
  const cand = [];

  // Pass 1 - one sample per distinct layout. Because the unscalable bits of a
  // card (1px borders) make height slightly super-linear, u0 * target/h(u0) is
  // a fair upper bound on what this budget could ever reach.
  for(let cap = 1; cap <= Math.min(MAX_COLS, maxDay); cap++){
    const shape = dayShape(board, cap);
    if(seen.has(shape)) continue;
    seen.add(shape);
    const uWidth = widthCap(board, cap, availW);
    if(uWidth < floor) continue;
    const u0 = Math.min(1, uWidth);
    const h0 = measure(board, cap, u0);
    cand.push({cap:cap, uWidth:uWidth, est:Math.min(uWidth, u0 * target / h0)});
  }
  cand.sort((a, b) => b.est - a.est);

  // Pass 2 - refine the promising ones, and stop as soon as no untried budget
  // could beat what we already have.
  let win = null, tried = 0;
  for(const k of cand){
    if(win && (k.est <= win.u || tried >= 3)) break;
    tried++;
    const u = solveScale(board, k.cap, k.uWidth, Math.min(k.est, k.uWidth), target, floor);
    if(u != null && (!win || u > win.u)) win = {cols:k.cap, u:u};
  }
  return win;
}

/* Scores change every few seconds; the shape of the board almost never does.
   Anything that could move a row - how many cards each day holds, how many of
   them are the taller scheduled kind, whether the feed-warning strip is up, and
   the size of the pane - goes in here, so a routine refresh can reuse the
   solved layout instead of searching for it again. */
function layoutSignature(board, availW, availH){
  const parts = [Math.round(availW), Math.round(availH), board.querySelector(".warn") ? 1 : 0];
  dayEls(board).forEach(d => {
    parts.push(d.dataset.n + ":" + d.querySelectorAll(".vs-time").length);
  });
  return parts.join("|");
}

function fitBoard(){
  const board = boardEl();
  if(!board.classList.contains("board")) return;   // spinner / error states self-centre
  if(!board.querySelector(".card")) return;

  const main = board.parentElement;
  const cs = getComputedStyle(main);
  const availW = main.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const availH = main.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  if(availH <= 0 || availW <= 0) return;

  const target = Math.floor(availH);   // scrollHeight is whole pixels

  const sig = layoutSignature(board, availW, availH);
  if(lastFit && lastFit.sig === sig){
    setSweep(board, availH, measure(board, lastFit.cols, lastFit.u));
    return;
  }

  const floor = tileFloor(board, availH);
  // Fit the whole slate if it can be done at a size worth reading; otherwise
  // hold that size, run as wide as the pane allows, and let it sweep.
  const best = searchFit(board, availW, target, floor) ||
               {cols:colsForWidth(availW, floor), u:floor};

  const height = measure(board, best.cols, best.u);
  lastFit = {sig:sig, cols:best.cols, u:best.u};
  setSweep(board, availH, height);
}

/* ===================== auto-sweep =====================
   A slate too long for the pane is neither cut off nor shrunk away: the board
   holds at the top, travels down at a walking pace, holds at the bottom and
   comes back up. Position is driven off the frame clock rather than a frame
   count, so the pace is the same on a 60Hz panel and a 144Hz one, and a long
   stall (a backgrounded tab) can't make it lurch.

   The travel survives the 10-30s refreshes: the offset is kept and re-clamped
   rather than reset, so a sweep is never thrown back to the top mid-slate. */

const SWEEP_PXPS = 65;     // travel speed in pixels a second
const SWEEP_HOLD = 4000;   // dwell at each end, ms

let sweepMax = 0;          // how far the board has to travel
let sweepPos = 0;          // where it has got to
let sweepDir = 1;
let sweepWait = SWEEP_HOLD;
let sweepRAF = null;
let sweepLast = 0;

function paintSweep(){
  const board = boardEl();
  board.style.transform = sweepPos ? "translateY(" + (-sweepPos).toFixed(1) + "px)" : "";
  const thumb = document.querySelector("#sweep b");
  if(thumb && sweepMax) thumb.style.left = (sweepPos / sweepMax * 70) + "%";
}

function setSweep(board, availH, height){
  sweepMax = Math.max(0, Math.ceil(height - availH));
  board.classList.toggle("sweeping", sweepMax > 0);
  const badge = document.getElementById("sweep");

  if(!sweepMax){
    stopSweep();
    sweepPos = 0;
    badge.className = "sweep";
    paintSweep();
    return;
  }

  badge.className = "sweep on";
  // The pane shows this much of the slate at once, so the thumb is that wide.
  badge.querySelector("b").style.width = clamp(8, availH / height * 100, 70) + "%";
  sweepPos = Math.min(sweepPos, sweepMax);
  paintSweep();
  startSweep();
}

function startSweep(){
  if(sweepRAF) return;
  sweepLast = performance.now();
  const step = now => {
    const dt = Math.min(now - sweepLast, 100);
    sweepLast = now;
    if(sweepWait > 0){
      sweepWait -= dt;
    }else{
      sweepPos += sweepDir * SWEEP_PXPS * dt / 1000;
      if(sweepPos >= sweepMax){ sweepPos = sweepMax; sweepDir = -1; sweepWait = SWEEP_HOLD; }
      else if(sweepPos <= 0){ sweepPos = 0; sweepDir = 1; sweepWait = SWEEP_HOLD; }
    }
    paintSweep();
    sweepRAF = requestAnimationFrame(step);
  };
  sweepRAF = requestAnimationFrame(step);
}

function stopSweep(){
  if(sweepRAF) cancelAnimationFrame(sweepRAF);
  sweepRAF = null;
  sweepDir = 1;
  sweepWait = SWEEP_HOLD;
}

/* Centred spinner/error states own the whole pane, so hand the box back. */
function resetFit(){
  lastFit = null;
  stopSweep();
  sweepPos = 0;
  sweepMax = 0;
  const board = boardEl();
  board.style.transform = "";
  board.style.removeProperty("--u");
  board.style.removeProperty("--cw");
  board.classList.remove("sweeping");
  document.getElementById("sweep").className = "sweep";
}

// Re-fit on anything that changes the box we have to fill.
let fitTimer = null;
const refit = () => { clearTimeout(fitTimer); fitTimer = setTimeout(fitBoard, 120); };
window.addEventListener("resize", refit);
window.addEventListener("orientationchange", refit);
document.addEventListener("fullscreenchange", refit);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitBoard);

/* ===================== controls ===================== */

function applyFilter(next){
  filter = next;
  try{ localStorage.setItem(STORE_KEY, filter); }catch(e){}
  document.querySelectorAll("#leagueFilter .lg").forEach(b => b.classList.toggle("on", b.dataset.league === filter));
  document.getElementById("iconPuck").style.display = filter === "nfl" ? "none" : "";
  document.getElementById("iconBall").style.display = filter === "nhl" ? "none" : "";
  const board = document.getElementById("board");
  resetFit();
  board.className = "center-state";
  board.innerHTML = '<div class="spinner"></div><p>Loading ' +
    (filter === "all" ? "NHL &amp; NFL" : SOURCES[filter].name) + "…</p>";
  clearTimeout(timer);
  load();
}

document.querySelectorAll("#leagueFilter .lg").forEach(btn => {
  btn.addEventListener("click", () => applyFilter(btn.dataset.league));
});
document.getElementById("refreshBtn").addEventListener("click", load);
document.getElementById("fsBtn").addEventListener("click", () => {
  if(!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  else document.exitFullscreen && document.exitFullscreen();
});

applyFilter(filter);
</script>
